<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 90" width="270" height="90" style="overflow:visible;">
  <defs>
    <filter id="lexigoGlowOrange" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ff5e00" flood-opacity="0.65"/>
    </filter>
    <filter id="lexigoGlowBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3b5bfd" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Lexi in royal blue -->
  <text x="6" y="66" font-family="'Nunito', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" fill="#3b5bfd" letter-spacing="-1px" filter="url(#lexigoGlowBlue)">Lexi</text>

  <!-- GO in vibrant orange with arrow inside O -->
  <g class="brand-go-group">
    <!-- G -->
    <text x="142" y="66" font-family="'Nunito', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" fill="#ff5e00" letter-spacing="-1px" filter="url(#lexigoGlowOrange)">G</text>

    <!-- O with arrow cutout (pure evenodd path) -->
    <g transform="translate(196, 21) scale(0.58)" filter="url(#lexigoGlowOrange)">
      <path fill="#ff5e00" fill-rule="evenodd" d="M 50,4 A 46,46 0 1,1 49.9,4 Z M 84,48 L 52,24 L 46,36 L 46,48 C 30,55 18,63 6,65 C 5,72 8,78 12,80 C 22,72 34,65 50,60 L 50,72 L 56,76 Z" transform="rotate(4 50 50)" />
    </g>
  </g>
</svg>
